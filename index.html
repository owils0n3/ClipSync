<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ClipSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bibliotecas do Firebase (Apenas App, Auth e Database) -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header Centralizado -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-4 flex flex-col items-center justify-center shadow-md sticky top-0 z-10 backdrop-blur-md bg-slate-800/90">
        <h1 class="text-lg font-bold tracking-tight text-white">ClipSync</h1>
        <div class="flex items-center gap-1.5 mt-0.5">
            <p class="text-xs text-slate-400 font-medium" id="sync-text">Conectando...</p>
            <span id="sync-status" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">

        <!-- Área de Entrada de Dados -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow-xl">
            <textarea id="input-texto" rows="3" placeholder="Cole textos, links ou prints aqui..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 text-slate-100 text-sm resize-none mb-3"></textarea>
            
            <div class="flex flex-col sm:flex-row gap-3 justify-between items-center">
                <div class="flex gap-2 w-full sm:w-auto">
                    <label class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 cursor-pointer rounded-xl text-sm font-semibold transition border border-slate-600">
                        <span>📸 Enviar Print</span>
                        <input type="file" id="input-imagem" accept="image/*" class="hidden" onchange="uploadImagem(event)">
                    </label>
                </div>
                
                <button onclick="enviarTexto()" class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-bold shadow-lg transition text-white">
                    Enviar Texto
                </button>
            </div>
            
            <!-- Indicador de Processamento Simples -->
            <div id="upload-progress-container" class="hidden w-full mt-4 flex items-center justify-center gap-2 text-blue-400">
                <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p id="upload-status" class="text-xs font-medium">Processando e sincronizando imagem...</p>
            </div>
        </div>

        <!-- Lista de Clipes -->
        <div class="flex flex-col gap-4 pb-10" id="lista-clipes">
            <div class="text-center text-slate-500 text-sm py-10">Nenhum item na área de transferência.</div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-100 text-slate-900 px-5 py-2.5 rounded-full text-sm font-bold shadow-xl transition-all duration-300 translate-y-20 opacity-0 z-50 pointer-events-none">
        Copiado!
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7vdvBDk6k48AlRDQpdrhOxG212MovmrM",
            authDomain: "rocha-batista.firebaseapp.com",
            databaseURL: "https://rocha-batista-default-rtdb.firebaseio.com",
            projectId: "rocha-batista",
            storageBucket: "rocha-batista.firebasestorage.app",
            messagingSenderId: "737568409775",
            appId: "1:737568409775:web:41b6eefa0b18199886ac5a"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.database();

        const DEFAULT_EMAIL = "rochabatista@wilson.com";
        const DEFAULT_PASS = "wrzt01";
        
        let userId = null;
        let clipes = [];
        const TEMPO_EXPIRACAO_DIAS = 7;

        auth.signInWithEmailAndPassword(DEFAULT_EMAIL, DEFAULT_PASS).catch(err => {
            updateSyncStatus('error', 'Erro');
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                userId = user.uid;
                ouvirBaseDeDados();
            }
        });

        function updateSyncStatus(status, text) {
            const dot = document.getElementById('sync-status');
            const txt = document.getElementById('sync-text');
            txt.innerText = text;
            dot.className = "inline-block w-2.5 h-2.5 rounded-full";
            
            if (status === 'synced') dot.classList.add('bg-emerald-500');
            else if (status === 'syncing') dot.classList.add('bg-amber-500', 'animate-pulse');
            else if (status === 'error') dot.classList.add('bg-rose-500');
            else dot.classList.add('bg-slate-500');
        }

        function ouvirBaseDeDados() {
            updateSyncStatus('syncing', 'Sincronizando');
            db.ref(`usuarios/${userId}/clip_sync`).on('value', snapshot => {
                const data = snapshot.val();
                clipes = [];
                let itensParaDeletar = {};
                const agora = Date.now();
                const limiteExpiracao = TEMPO_EXPIRACAO_DIAS * 24 * 60 * 60 * 1000;

                if (data) {
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        if (agora - item.timestamp > limiteExpiracao) {
                            itensParaDeletar[key] = null;
                        } else {
                            clipes.push({ id: key, ...item });
                        }
                    });
                }

                if (Object.keys(itensParaDeletar).length > 0) {
                    db.ref(`usuarios/${userId}/clip_sync`).update(itensParaDeletar);
                }

                clipes.sort((a, b) => b.timestamp - a.timestamp);
                renderizarClipes();
                updateSyncStatus('synced', 'Ativo');
            });
        }

        function enviarTexto() {
            const textarea = document.getElementById('input-texto');
            const texto = textarea.value.trim();
            if (!texto || !userId) return;

            db.ref(`usuarios/${userId}/clip_sync`).push({
                tipo: 'texto',
                conteudo: texto,
                timestamp: Date.now()
            });

            textarea.value = '';
        }

        function uploadImagem(event) {
            const file = event.target.files[0];
            if (!file) return;
            processarImagemBase64(file);
            event.target.value = '';
        }

        document.getElementById('input-texto').addEventListener('paste', (e) => {
            const clipboardData = e.clipboardData || window.clipboardData || (e.originalEvent && e.originalEvent.clipboardData);
            if (!clipboardData) return;

            const items = clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].kind === 'file' && items[i].type.includes('image/')) {
                    e.preventDefault(); 
                    const file = items[i].getAsFile();
                    processarImagemBase64(file);
                    return; 
                }
            }
        });

        function processarImagemBase64(file) {
            if (!userId) return;
            
            const progressContainer = document.getElementById('upload-progress-container');
            const statusText = document.getElementById('upload-status');
            
            progressContainer.classList.remove('hidden');
            progressContainer.classList.add('flex');
            statusText.innerText = 'Processando e sincronizando imagem...';

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    
                    const MAX_WIDTH = 2000;
                    const MAX_HEIGHT = 2000;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64String = canvas.toDataURL('image/jpeg', 0.95);

                    db.ref(`usuarios/${userId}/clip_sync`).push({
                        tipo: 'imagem',
                        conteudo: base64String,
                        timestamp: Date.now()
                    }).then(() => {
                        esconderProgresso();
                    }).catch(err => {
                        alert('Erro ao enviar imagem: ' + err.message);
                        esconderProgresso();
                    });
                };
                img.src = event.target.result;
            };
            reader.onerror = function() {
                alert('Erro ao ler a imagem colada.');
                esconderProgresso();
            };
            reader.readAsDataURL(file);
        }

        function esconderProgresso() {
            setTimeout(() => {
                const progressContainer = document.getElementById('upload-progress-container');
                progressContainer.classList.add('hidden');
                progressContainer.classList.remove('flex');
            }, 500);
        }

        function apagarItem(id) {
            db.ref(`usuarios/${userId}/clip_sync/${id}`).remove();
        }

        // Função de copiar inteligente: Trata texto e imagem
        async function copiarItem(id) {
            const item = clipes.find(c => c.id === id);
            if (!item || !item.conteudo) return;

            if (item.tipo === 'texto') {
                navigator.clipboard.writeText(item.conteudo).then(() => {
                    mostrarToast();
                }).catch(err => {
                    const textArea = document.createElement("textarea");
                    textArea.value = item.conteudo;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    document.body.removeChild(textArea);
                    mostrarToast();
                });
            } else if (item.tipo === 'imagem') {
                try {
                    const response = await fetch(item.conteudo);
                    const blob = await response.blob();
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            [blob.type]: blob
                        })
                    ]);
                    mostrarToast();
                } catch (err) {
                    alert('Erro ao copiar imagem pelo botão. Por favor, segure na imagem e selecione "Copiar".');
                }
            }
        }

        function mostrarToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }

        function formatarData(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        function renderizarClipes() {
            const container = document.getElementById('lista-clipes');
            
            if (clipes.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 text-sm py-10">Nenhum item na área de transferência.</div>`;
                return;
            }

            container.innerHTML = clipes.map(item => {
                const dataFormatada = formatarData(item.timestamp);
                
                if (item.tipo === 'texto') {
                    const safeText = escapeHTML(item.conteudo);
                    return `
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow flex flex-col gap-3 transition hover:border-slate-600">
                            <div class="flex justify-between items-start gap-2">
                                <p class="text-sm font-medium text-slate-200 line-clamp-2 break-all">${safeText}</p>
                            </div>
                            <div class="flex justify-between items-end mt-1">
                                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500">${dataFormatada}</span>
                                <div class="flex gap-2">
                                    <button onclick="apagarItem('${item.id}')" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-400 hover:text-rose-400 hover:border-rose-500/30 transition text-xs font-semibold">Apagar</button>
                                    <button onclick="copiarItem('${item.id}')" class="px-5 py-1.5 rounded-lg bg-slate-200 hover:bg-white text-slate-900 font-bold transition text-xs shadow-sm">Copiar</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (item.tipo === 'imagem') {
                    return `
                        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-3 shadow flex flex-col gap-3 transition hover:border-slate-600">
                            <div class="block w-full bg-slate-900 rounded-xl overflow-hidden border border-slate-700/50 flex justify-center">
                                <img src="${item.conteudo}" alt="Print salvo" class="w-auto object-contain max-h-64 opacity-95 hover:opacity-100 transition">
                            </div>
                            <div class="flex justify-between items-end px-1">
                                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500">${dataFormatada}</span>
                                <div class="flex gap-2">
                                    <button onclick="apagarItem('${item.id}')" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-400 hover:text-rose-400 hover:border-rose-500/30 transition text-xs font-semibold">Apagar</button>
                                    <button onclick="copiarItem('${item.id}')" class="px-5 py-1.5 rounded-lg bg-slate-200 hover:bg-white text-slate-900 font-bold transition text-xs shadow-sm">Copiar</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }
    </script>
</body>
</html>
